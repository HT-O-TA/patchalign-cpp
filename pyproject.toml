[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchalign-cpp"
version = "0.0.0"
description = "Verifiable post-training for localized C++ defect repair"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
patchalign-cpp = "patchalign.cli:main"

[project.optional-dependencies]
inference = [
  "accelerate>=1.13,<1.14",
  "bitsandbytes>=0.49,<0.50",
  "numpy>=1.26,<3",
  "peft>=0.18,<0.19",
  "torch>=2.1",
  "transformers>=4.57,<4.58",
]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.4,<9",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
