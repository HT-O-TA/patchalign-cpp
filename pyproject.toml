[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchalign-cpp"
version = "0.0.0"
description = "Verifiable post-training for localized C++ defect repair"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.4,<9",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
